[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlhm"
version = "1.0.0"
description = "Codebook for 'Optimizing Differential Privacy Parameters in Machine Learning Healthcare Models' (D.Sc. dissertation, Marymount University, 2025)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nick Pierrelouis"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.6,<1.9",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "diffprivlib==0.6.6",
]

[project.urls]
Homepage = "https://github.com/nickpxp/dp-mlhm-dissertation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning", "ignore::UserWarning"]
